name: API Contract Guard Check

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Run API Contract Breaking-Change Detector
        run: java -jar api-contract-guard.jar samples/old samples/new